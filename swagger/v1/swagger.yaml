---
openapi: 3.0.1
info:
  title: OPJ API
  version: v1
servers:
- url: http://localhost:3000
  description: Desenvolvimento
- url: https://www.projetosopjengenharia.com.br/api/v2
  description: Produção
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        link:
          type: string
          nullable: true
        place:
          type: string
          nullable: true
        cep:
          type: string
          nullable: true
        number:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        complement:
          type: string
          nullable: true
        neighborhood:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        tax_id:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          "$ref": "#/components/schemas/Address"
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
    Concessionaire:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        acronym:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        active:
          type: boolean
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
    Coordinates:
      type: object
      nullable: true
      properties:
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
      required:
      - latitude
      - longitude
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        address_id:
          type: string
          format: uuid
          nullable: true
        utility_company:
          type: string
        utility_protocol:
          type: string
        secondary_protocol:
          type: string
          nullable: true
        customer_class:
          type: string
        integrator:
          type: string
          format: uuid
          nullable: true
        integrator_name:
          type: string
          nullable: true
        modality:
          type: string
        framework:
          type: string
        status:
          type: string
          nullable: true
        amount:
          type: string
          nullable: true
        dc_protection:
          type: string
          nullable: true
        system_power:
          type: number
          format: float
          nullable: true
        unit_control:
          type: string
        description:
          type: string
          nullable: true
        project_type:
          type: string
        fast_track:
          type: boolean
        coordinates:
          "$ref": "#/components/schemas/Coordinates"
        services_names:
          type: array
          items:
            type: string
          nullable: true
        editable:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - client_id
      - utility_company
      - utility_protocol
      - customer_class
      - modality
      - framework
      - unit_control
      - project_type
      - fast_track
    Upload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        item_id:
          type: string
          format: uuid
        filename:
          type: string
        url_s3:
          type: string
        size:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - item_id
      - filename
      - url_s3
      - size
    Page:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
        totalElements:
          type: integer
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
        numberOfElements:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean
    ProjectStatusComment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
        status_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - body
      - status_id
    ProjectStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project_id:
          type: string
          format: uuid
        comments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              body:
                type: string
              created_by:
                type: string
                format: uuid
                nullable: true
              created_at:
                type: string
                format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - project_id
    TechnicalDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        opening_date:
          type: string
          format: date
          nullable: true
        supply_voltage:
          type: string
          nullable: true
        new_project:
          type: boolean
        zero_grid_control:
          type: boolean
        modules:
          type: array
          items:
            type: string
        inverters:
          type: array
          items:
            type: string
        entry_standard_items:
          type: array
          items:
            type: string
        credit_divisions:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - project_id
      - new_project
      - zero_grid_control
    CalendarEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
          nullable: true
        date:
          type: string
          format: date
        content:
          type: object
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - date
      - content
    Error:
      type: object
      properties:
        message:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        profile:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - email
      - profile
    AuthToken:
      type: object
      properties:
        token:
          type: string
        user:
          "$ref": "#/components/schemas/User"
      required:
      - token
      - user
    Apportionment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        consumer_unit:
          type: string
        address:
          type: string
        classification:
          type: string
        percentage:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - service_id
      - consumer_unit
      - address
      - classification
      - percentage
    ServiceEntryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        connection_type:
          type: string
        classification:
          type: string
        quantity:
          type: integer
        circuit_breaker:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - service_id
      - connection_type
      - classification
      - quantity
      - circuit_breaker
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        service_type:
          type: string
        customer_id:
          type: string
          format: uuid
        concessionaire_id:
          type: string
          format: uuid
        opening_date:
          type: string
          format: date
        amount:
          type: string
        discount_coupon_percentage:
          type: integer
          nullable: true
        observations:
          type: string
          nullable: true
        supply_voltage:
          type: string
          nullable: true
        coordinates:
          "$ref": "#/components/schemas/Coordinates"
        generating_consumer_unit:
          type: string
          nullable: true
        pole_distance_over_30m:
          type: boolean
        construction_address_id:
          type: string
          format: uuid
          nullable: true
        generating_address_id:
          type: string
          format: uuid
          nullable: true
        apportionments:
          type: array
          items:
            "$ref": "#/components/schemas/Apportionment"
        service_entry_items:
          type: array
          items:
            "$ref": "#/components/schemas/ServiceEntryItem"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - service_type
      - customer_id
      - concessionaire_id
      - opening_date
      - amount
      - pole_distance_over_30m
paths:
  "/addresses":
    get:
      summary: Lista todos os endereços
      tags:
      - Addresses
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: lista de endereços
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Address"
    post:
      summary: Cria um endereço
      tags:
      - Addresses
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '201':
          description: endereço criado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Address"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                link:
                  type: string
                place:
                  type: string
                cep:
                  type: string
                number:
                  type: string
                address:
                  type: string
                complement:
                  type: string
                neighborhood:
                  type: string
                city:
                  type: string
                state:
                  type: string
  "/addresses/paginate":
    get:
      summary: Lista endereços paginados
      tags:
      - Addresses
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Página (começa em 1)
        schema:
          type: integer
      - name: items
        in: query
        required: false
        description: Itens por página
        schema:
          type: integer
      responses:
        '200':
          description: página de endereços
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Page"
                - type: object
                  properties:
                    content:
                      type: array
                      items:
                        "$ref": "#/components/schemas/Address"
  "/addresses/{id}":
    parameters:
    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    get:
      summary: Busca um endereço
      tags:
      - Addresses
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: endereço encontrado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Address"
        '404':
          description: não encontrado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Atualiza um endereço
      tags:
      - Addresses
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: endereço atualizado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Address"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                link:
                  type: string
                place:
                  type: string
                cep:
                  type: string
                number:
                  type: string
                address:
                  type: string
                complement:
                  type: string
                neighborhood:
                  type: string
                city:
                  type: string
                state:
                  type: string
    delete:
      summary: Remove um endereço
      tags:
      - Addresses
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '204':
          description: removido com sucesso
        '404':
          description: não encontrado
  "/auth/register":
    post:
      summary: Registra um novo usuário
      tags:
      - Auth
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '201':
          description: usuário criado e token retornado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthToken"
        '422':
          description: dados inválidos
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              properties:
                name:
                  type: string
                email:
                  type: string
                profile:
                  type: string
                password:
                  type: string
  "/auth/login":
    post:
      summary: Autentica um usuário
      tags:
      - Auth
      security: []
      parameters: []
      responses:
        '200':
          description: autenticado com sucesso
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthToken"
        '401':
          description: credenciais inválidas
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
  "/auth/me":
    get:
      summary: Retorna o usuário autenticado
      tags:
      - Auth
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: usuário retornado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: token ausente ou inválido
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
  "/calendar_events":
    get:
      summary: Lista os eventos do calendário em um período
      tags:
      - Calendar Events
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      - name: from
        in: query
        format: date
        required: false
        description: Data inicial (inclusive)
        schema:
          type: string
      - name: to
        in: query
        format: date
        required: false
        description: Data final (inclusive)
        schema:
          type: string
      responses:
        '200':
          description: lista completa sem filtro, incluindo vários itens na mesma
            data
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/CalendarEvent"
    post:
      summary: Cria um evento no calendário
      tags:
      - Calendar Events
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '201':
          description: evento criado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CalendarEvent"
        '422':
          description: data ausente
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                content:
                  type: object
              required:
              - date
  "/calendar_events/{id}":
    parameters:
    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    get:
      summary: Mostra um evento do calendário
      tags:
      - Calendar Events
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: evento encontrado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CalendarEvent"
        '404':
          description: evento não encontrado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Atualiza um evento do calendário
      tags:
      - Calendar Events
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: evento atualizado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CalendarEvent"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                content:
                  type: object
    delete:
      summary: Remove um evento do calendário
      tags:
      - Calendar Events
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '204':
          description: removido com sucesso
  "/concessionaires":
    get:
      summary: Lista todas as concessionárias
      tags:
      - Concessionaires
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: lista de concessionárias
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Concessionaire"
    post:
      summary: Cria uma concessionária
      tags:
      - Concessionaires
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '201':
          description: concessionária criada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Concessionaire"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                acronym:
                  type: string
                code:
                  type: string
                region:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                active:
                  type: boolean
  "/concessionaires/paginate":
    get:
      summary: Lista concessionárias paginadas
      tags:
      - Concessionaires
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Página (começa em 1)
        schema:
          type: integer
      - name: items
        in: query
        required: false
        description: Itens por página
        schema:
          type: integer
      responses:
        '200':
          description: página de concessionárias
          content:
            application/json:
              schema:
                allOf:
                - "$ref": "#/components/schemas/Page"
                - type: object
                  properties:
                    content:
                      type: array
                      items:
                        "$ref": "#/components/schemas/Concessionaire"
  "/concessionaires/{id}":
    parameters:
    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    get:
      summary: Busca uma concessionária
      tags:
      - Concessionaires
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: concessionária encontrada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Concessionaire"
        '404':
          description: não encontrado
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Error"
    patch:
      summary: Atualiza uma concessionária
      tags:
      - Concessionaires
      security:
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: Bearer token
        schema:
          type: string
      responses:
        '200':
          description: concessionária atualizada
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Concessionaire"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                acronym:
                  type: string
                code:
                  type: string
                region:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                active:
                  type: boolean
    delete:
