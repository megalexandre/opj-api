# Stack de monitoramento da OPJ API (Prometheus + Grafana).
# Cole este arquivo no Coolify em: + New → Docker Compose Empty. Ative
# "Connect to Predefined Network" e configure o domínio do grafana com :3000.
# As configs vão embutidas via `content:` (extensão do Coolify) porque nesse
# modo não há repositório no servidor. Não use cifrão nos conteúdos: o compose
# interpreta como variável. Detalhes no README, seção "Observabilidade".
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    # root só para ler o socket do Docker (read-only), usado para descobrir a API.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - prometheus-data:/prometheus
      - type: bind
        source: ./etc/prometheus/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
        content: |
          global:
            scrape_interval: 30s
            evaluation_interval: 30s
          
          scrape_configs:
            - job_name: opj-api
              metrics_path: /metrics
              # Descobre os containers da imagem da API pelo socket do Docker. O Coolify
              # recria o container (com outro nome) a cada deploy, então um alvo estático
              # quebraria; a descoberta acompanha o container novo sozinha.
              docker_sd_configs:
                - host: unix:///var/run/docker.sock
                  refresh_interval: 30s
                  filters:
                    - name: ancestor
                      values: ["alexandreqrz/opjapi:latest"]
              relabel_configs:
                # Só a porta do exporter (9394), não a porta 80 da API.
                - source_labels: [__meta_docker_port_private]
                  regex: "9394"
                  action: keep
                # Só o endereço na rede compartilhada do Coolify.
                - source_labels: [__meta_docker_network_name]
                  regex: coolify
                  action: keep
                - source_labels: [__meta_docker_container_name]
                  regex: /?(.*)
                  target_label: instance
          
            - job_name: prometheus
              static_configs:
                - targets: ["localhost:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      - SERVICE_FQDN_GRAFANA_3000
      - GF_SERVER_ROOT_URL=${SERVICE_URL_GRAFANA:-http://localhost:3000}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${SERVICE_PASSWORD_GRAFANA:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - type: bind
        source: ./etc/grafana/provisioning/datasources/prometheus.yml
        target: /etc/grafana/provisioning/datasources/prometheus.yml
        read_only: true
        content: |
          apiVersion: 1
          
          datasources:
            - name: Prometheus
              uid: prometheus
              type: prometheus
              access: proxy
              url: http://prometheus:9090
              isDefault: true
              jsonData:
                timeInterval: 30s
      - type: bind
        source: ./etc/grafana/provisioning/dashboards/dashboards.yml
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
        read_only: true
        content: |
          apiVersion: 1
          
          providers:
            - name: opj
              folder: OPJ
              type: file
              disableDeletion: true
              options:
                path: /etc/grafana/dashboards
      - type: bind
        source: ./etc/grafana/dashboards/opj-api.json
        target: /etc/grafana/dashboards/opj-api.json
        read_only: true
        content: |
          {
            "uid": "opj-api",
            "title": "OPJ API",
            "tags": [
              "opj",
              "rails"
            ],
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 1,
            "editable": true,
            "refresh": "30s",
            "time": {
