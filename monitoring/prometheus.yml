global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: opj-api
    metrics_path: /metrics
    # Descobre os containers da imagem da API pelo socket do Docker. O Coolify
    # recria o container (com outro nome) a cada deploy, então um alvo estático
    # quebraria; a descoberta acompanha o container novo sozinha.
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
        filters:
          - name: ancestor
            values: ["alexandreqrz/opjapi:latest"]
    relabel_configs:
      # Só a porta do exporter (9394), não a porta 80 da API.
      - source_labels: [__meta_docker_port_private]
        regex: "9394"
        action: keep
      # Só o endereço na rede compartilhada do Coolify.
      - source_labels: [__meta_docker_network_name]
        regex: coolify
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: /?(.*)
        target_label: instance

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
